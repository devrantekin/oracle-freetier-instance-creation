name: Oracle 7/24 Mumbai Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: oracle-bot
  cancel-in-progress: false

jobs:
  run-oracle-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install oci paramiko python-dotenv requests

      - name: Config dosyalarını oluştur
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_FP: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_COMP: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          printf '%s\n' "$OCI_PRIVATE_KEY" > oracle_key.pem
          chmod 600 oracle_key.pem
          cat > oci_config <<EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FP
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=$GITHUB_WORKSPACE/oracle_key.pem
          EOF
          echo "OCI_CONFIG_PATH=$GITHUB_WORKSPACE/oci_config" > .env
          echo "COMPARTMENT_ID=$OCI_COMP" >> .env

      - name: Botu çalıştır
        run: python main.py
