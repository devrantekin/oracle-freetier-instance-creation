name: Oracle 7/24 Mumbai Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-oracle-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları İndir
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install oci paramiko python-dotenv

      - name: Botun Aradığı Özel Dosyaları Oluştur
        run: |
          # Botun hata verdiği "/home/ubuntu/oracle-freetier-instance-creation/" dizin yapısını taklit ediyoruz
          sudo mkdir -p /home/ubuntu/oracle-freetier-instance-creation
          
          # Private Key dosyasını oluşturuyoruz
          echo "${{ secrets.OCI_PRIVATE_KEY }}" | sudo tee /home/ubuntu/oracle-freetier-instance-creation/oracle_key.pem > /dev/null
          sudo chmod 600 /home/ubuntu/oracle-freetier-instance-creation/oracle_key.pem
          
          # Botun ısrarla aradığı o 'oci_config' dosyasını tam istediği formatta oluşturuyoruz
          echo "[DEFAULT]" | sudo tee /home/ubuntu/oracle-freetier-instance-creation/oci_config > /dev/null
          echo "user=${{ secrets.OCI_USER_OCID }}" | sudo tee -a /home/ubuntu/oracle-freetier-instance-creation/oci_config > /dev/null
          echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" | sudo tee -a /home/ubuntu/oracle-freetier-instance-creation/oci_config > /dev/null
          echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" | sudo tee -a /home/ubuntu/oracle-freetier-instance-creation/oci_config > /dev/null
          echo "region=${{ secrets.OCI_REGION }}" | sudo tee -a /home/ubuntu/oracle-freetier-instance-creation/oci_config > /dev/null
          echo "key_file=/home/ubuntu/oracle-freetier-instance-creation/oracle_key.pem" | sudo tee -a /home/ubuntu/oracle-freetier-instance-creation/oci_config > /dev/null

          # Botun şifreleri okuduğu .env dosyasını oluşturuyoruz
          echo "OCI_CONFIG_PATH=/home/ubuntu/oracle-freetier-instance-creation/oci_config" | sudo tee /home/runner/work/oracle-freetier-instance-creation/oracle-freetier-instance-creation/.env > /dev/null
          echo "COMPARTMENT_ID=${{ secrets.OCI_COMPARTMENT_OCID }}" | sudo tee -a /home/runner/work/oracle-freetier-instance-creation/oracle-freetier-instance-creation/.env > /dev/null

      - name: Botu Başlat
        run: |
          python main.py
