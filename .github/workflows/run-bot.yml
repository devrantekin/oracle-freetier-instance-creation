name: Oracle 7/24 Mumbai Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: oracle-bot
  cancel-in-progress: false

jobs:
  run-oracle-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install oci paramiko python-dotenv requests

      - name: Config dosyalarını oluştur
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_FP: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          printf '%s\n' "$OCI_PRIVATE_KEY" > oracle_key.pem
          chmod 600 oracle_key.pem

          if [ -n "$SSH_PUBLIC_KEY" ]; then
            printf '%s\n' "$SSH_PUBLIC_KEY" > id_rsa.pub
          fi

          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER"
            echo "fingerprint=$OCI_FP"
            echo "tenancy=$OCI_TENANCY"
            echo "region=$OCI_REGION"
            echo "key_file=$GITHUB_WORKSPACE/oracle_key.pem"
          } > oci_config

          {
            echo "OCI_CONFIG=$GITHUB_WORKSPACE/oci_config"
            echo "OCT_FREE_AD=AD-1"
            echo "DISPLAY_NAME=oracle-arm"
            echo "REQUEST_WAIT_TIME_SECS=60"
            echo "SSH_AUTHORIZED_KEYS_FILE=$GITHUB_WORKSPACE/id_rsa.pub"
            echo "OCI_COMPUTE_SHAPE=VM.Standard.A1.Flex"
            echo "OPERATING_SYSTEM=Canonical Ubuntu"
            echo "OS_VERSION=22.04"
            echo "ASSIGN_PUBLIC_IP=true"
            echo "BOOT_VOLUME_SIZE=50"
            echo "DISCORD_WEBHOOK=$DISCORD_WEBHOOK"
            echo "NOTIFY_EVERY_N_ATTEMPTS=10"
          } > oci.env

      - name: Botu çalıştır
        run: python main.py

      - name: Logları göster
        if: always()
        run: |
          tail -n 30 launch_instance.log 2>/dev/null || true
          tail -n 30 setup_and_info.log 2>/dev/null || true
